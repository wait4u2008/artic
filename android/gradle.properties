org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 9 built-in Kotlin must stay OFF: Flutter plugins (e.g. file_selector_android)
# still declare kotlin-gradle-plugin on their buildscript classpath, which AGP 9
# rejects in built-in mode. With it off, plugins compile via KGP (2.3.0+ is
# Gradle-9 compatible).
android.builtInKotlin=false

# MSYS bash often drops JAVA_HOME for the Gradle daemon; pin the JDK explicitly.
org.gradle.java.home=D:/Softwares/jdk17/jdk-17.0.16+8
# Kotlin incremental compile cache corruption workaround.
kotlin.incremental=false
kotlin.incremental.java=false
